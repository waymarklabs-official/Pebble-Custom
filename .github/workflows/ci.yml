name: ci

# Tests on every push and pull request. Images are published to GHCR only from pushes to this
# repository (never from pull requests), and only after the tests pass and the arm64 image has
# booted and answered its health check under emulation.
#
# Published image: ghcr.io/waymarklabs-official/pebble-custom
#   :main / :latest   newest commit on the default branch
#   :<branch>         newest commit on that branch (slashes become dashes)
#   :sha-<7 chars>    one exact commit (pin this for a stable production install)
#   :<x.y.z>, :<x.y>  release tags v<x.y.z>

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/waymarklabs-official/pebble-custom

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,llm]'
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest -q

  image:
    name: image (linux/amd64 + linux/arm64)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build arm64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ringhub:smoke-arm64
          cache-from: type=gha,scope=ringhub
          cache-to: type=gha,scope=ringhub,mode=max

      - name: Smoke test the arm64 image (what a Raspberry Pi runs)
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' ringhub:smoke-arm64)" = linux/arm64
          mkdir -p smoke/data && chmod 777 smoke/data
          PYTHONPATH=src python3 -m ringhub.envfile --host ci.example.ts.net --tz America/New_York > smoke/.env
          echo "NTFY_TOKEN=tk_ci00000000000000000000000000" >> smoke/.env
          cp config.example.yaml smoke/config.yaml
          docker run -d --name smoke --platform linux/arm64 --env-file smoke/.env \
            -e NTFY_URL=http://127.0.0.1:2586 -p 127.0.0.1:8787:8787 \
            -v "$PWD/smoke/config.yaml:/app/config.yaml:ro" -v "$PWD/smoke/data:/app/data" \
            ringhub:smoke-arm64
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:8787/                       # dashboard is in the image
          curl -fsS -o /dev/null http://127.0.0.1:8787/static/views/modes.js
          docker exec smoke ringhub check -c /app/config.yaml
          test "$(docker inspect --format '{{.Config.User}}' smoke)" = ringhub   # never root

      - name: Smoke test logs
        if: always()
        run: docker logs smoke 2>&1 | tail -n 50 || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish) amd64 + arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ringhub
          cache-to: type=gha,scope=ringhub,mode=max
