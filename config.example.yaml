# ringhub config: infrastructure only.
#
# Skills, modes and places live in the dashboard (http://<hub>:8787/). On first boot the hub
# writes a sensible default set you can change: Sleep, In the car, Work, Heading out, Morning,
# Home and Everywhere.
#
# Any value can reference an environment variable: ${NAME} or ${NAME:-fallback}.

timezone: America/Chicago            # reminders and "tomorrow at 9" use this

server:
  port: 8787
  data_dir: ./data                   # SQLite (notes, reminders, catalog), audio, ADB keys
  public_url: ${RINGHUB_PUBLIC_URL:-}  # how your phone reaches the hub, e.g. https://hub.tail1234.ts.net
  admin_token: ${RINGHUB_ADMIN_TOKEN}  # dashboard login (`ringhub secret` makes one)
  context_token: ${RINGHUB_CONTEXT_TOKEN}  # your phone's Shortcuts/OwnTracks use this; it can only report context

ring:
  secrets:
    default: ${RINGHUB_SECRET}       # paste the same secret into each gesture's webhook in the Index app
  keep_audio: true                   # keep voice recordings (data/audio) when the app sends them

ntfy:                                # how the hub talks back: confirmations, answers, reminders
  url: https://ntfy.sh               # or your own server (set upstream-base-url for timely iOS pushes)
  topic: ${NTFY_TOPIC}               # pick something unguessable
  token: ${NTFY_TOKEN:-}

memory:
  ack_window_seconds: 120            # after a reminder fires: click = done, double = snooze
  digest_time: "21:30"               # evening summary; remove to disable
  # markdown_dir: /srv/obsidian/Ring # mirror every note into daily Markdown files

# tesla:                             # enables the "Car: trunk or climate" skill (see docs/SETUP.md)
#   base_url: https://localhost:4443 # Tesla's vehicle-command proxy (signs commands)
#   read_url: https://fleet-api.prd.na.vn.cloud.tesla.com   # state reads go straight to Fleet API
#   vin: ${TESLA_VIN}
#   client_id: ${TESLA_CLIENT_ID}
#   refresh_token: ${TESLA_REFRESH_TOKEN}
#   ca_cert: ./tesla-proxy/tls-cert.pem

# llm:                               # optional: understands reminders the built-in parser misses
#   api_key: ${ANTHROPIC_API_KEY}

# devices:                           # optional TV skills (Android/Fire TV via ADB, Roku via ECP)
#   living_tv: {type: androidtv, host: 192.168.1.50, room: living}
